# TỰ ĐỘNG SINH - ĐỪNG SỬA TAY.
#
# Sinh bởi: claude-opus-5 (phiên Claude Code, tương đương `augment.py` prompt v3)
# Thời điểm: 2026-08-24
#
# Đây KHÔNG phải dữ liệu hạt giống. Câu viết tay nằm ở thư mục cha.
# Xoá cả thư mục `generated/` là quay về đúng dataset hạt giống.
#
# Nhóm này dùng chung cho MỌI kịch bản nên câu phải trung tính - không được
# dính đặc trưng của nhà hàng / cửa hàng / hỏi đường.

- intent: greeting
  examples:
    - お久しぶりです
    - おひさしぶりです
    - お元気ですか
    - おげんきですか
    - 元気ですか
    - 調子はどうですか
    - ごきげんいかがですか
    - こんにちは、すみません
    - あの、こんにちは
    - はじめまして、こんにちは

- intent: thanks
  examples:
    - ほんとうにありがとうございます
    - 助かります
    - お世話になりました
    - ご親切にありがとうございます
    - 親切にどうも
    - わざわざありがとうございます
    - 教えてくれてありがとう
    - 教えていただきありがとうございます
    - ご協力ありがとうございます

- intent: apologize
  examples:
    - 本当にすみません
    - お待たせしてすみません
    - 遅れてすみません
    - 迷惑をかけてすみません
    - お手数をおかけします
    - お邪魔します

- intent: farewell
  examples:
    - それでは
    - じゃあ
    - またあした
    - また来週
    - 失礼いたします
    - 気をつけて
    - お気をつけて
    - よい一日を
    - おやすみなさい

- intent: affirm
  examples:
    - はいそうです
    - もちろんです
    - いいです
    - お願いします
    - そうしてください
    - ぜひお願いします
    - 了解です
    - そのとおりです
    - 賛成です
    - それでいいです

- intent: deny
  examples:
    - そうではありません
    - いいえ違います
    - 必要ありません
    - 今はいいです
    - また今度にします
    - ちょっと違います
    - そうでもないです
    - あまり好きではありません

- intent: not_understand
  examples:
    - よくわかりません
    - ちょっとわかりません
    - 意味がわかりません
    - もういちど言ってください
    - すみませんもう一度
    - 早すぎます
    - 聞こえませんでした
    - よく聞こえません
    - 何と言いましたか
    - それはどんな意味ですか
    - 難しいです
    - 日本語が下手です
    - 少しだけ日本語がわかります
    - 書いてもらえますか

- intent: meta_about_bot
  examples:
    - ヒントはありますか
    - 何を言えばいいですか
    - どう答えればいいですか
    - 例を教えてください
    - わからないので助けてください
    - 教えてください
    - 次は何をしますか
    - このあとどうしますか
    - これは何の練習ですか
    - 今どの場面ですか
    - もう一度最初から
    - やり直したいです
