# TỰ ĐỘNG SINH - ĐỪNG SỬA TAY.
#
# Sinh bởi: claude-opus-5 (phiên Claude Code, tương đương `augment.py` prompt v3)
# Thời điểm: 2026-08-24
#
# Đây KHÔNG phải dữ liệu hạt giống. Câu viết tay nằm ở thư mục cha.
# Xoá cả thư mục `generated/` là quay về đúng dataset hạt giống.
#
# CHỈ sinh NHÓM A: tiếng Nhật đúng ngữ pháp nhưng lạc khỏi kịch bản.
#
# Cố ý KHÔNG sinh thêm rác / emoji / đập bàn phím (nhóm B-D của file hạt
# giống): `guards.py` đã chặn sạch nhóm đó một cách tất định với 0% chặn oan,
# nên nhồi thêm vào tập train chỉ làm loãng lớp mà không thêm khả năng gì.
# Nhóm A mới là nhóm khó, và là nơi 17.5% lỗi lọt hiện nay tập trung.
#
# Có một khối lớn 「〜に行きたいです」 với đích XA. Đó là cặp đối chứng của
# directions_ask_how_to_get - đọc README mục "Ranh giới mong manh" trước khi
# đụng vào.

