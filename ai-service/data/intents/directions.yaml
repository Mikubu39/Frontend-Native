# ---------------------------------------------------------------------------
# Tình huống: HỎI ĐƯỜNG (道を聞く) - trình độ N5
# Vai của AI: 通行人 (người qua đường). Vai người học: khách du lịch bị lạc.
# ---------------------------------------------------------------------------

- intent: directions_ask_where
  scenario: directions
  description: "Hỏi một địa điểm ở đâu"
  examples:
    - 駅はどこですか
    - えきはどこですか
    - 駅はどこにありますか
    - トイレはどこですか
    - おてあらいはどこですか
    - コンビニはどこですか
    - 銀行はどこですか
    - ぎんこうはどこですか
    - 病院はどこですか
    - びょういんはどこですか
    - 郵便局はどこですか
    - ゆうびんきょくはどこですか
    - バス停はどこですか
    - ばすていはどこですか
    - この店はどこですか
    - ホテルはどこですか
    - 空港はどこですか
    - すみません、駅はどこですか
    - すみません、トイレはどこにありますか
    - 地下鉄の駅はどこですか
    - 交番はどこですか
    - スーパーはどこにありますか
    - 東京駅はどこですか

- intent: directions_ask_how_to_get
  scenario: directions
  description: "Hỏi cách đi tới nơi nào đó"
  examples:
    - どうやって行きますか
    - どうやっていきますか
    - 駅までどうやって行きますか
    - どうやって行けばいいですか
    - どう行けばいいですか
    - 行き方を教えてください
    - いきかたを教えてください
    - 道を教えてください
    - みちを教えてください
    - 駅への行き方を教えてください
    - まっすぐですか
    - 右ですか、左ですか
    - みぎですか、ひだりですか
    - どっちですか
    - どちらですか
    - 電車で行けますか
    - バスで行けますか
    - 歩いて行けますか
    - あるいて行けますか
    - タクシーがいいですか
    - この道でいいですか
    - 何番のバスですか
    - どの電車に乗りますか
    - どこで降りますか
    # --- Nêu ĐÍCH ĐẾN thay vì hỏi thẳng đường ---
    #
    # 「〜に行きたいです」 là cách mở lời rất tự nhiên của người thật, và câu
    # đáp đúng vẫn là chỉ đường - nên gộp vào ý định này chứ không tách lớp mới.
    #
    # CẨN THẬN khi sửa nhóm này: out_of_scope.yaml có 「日本に行きたいです」.
    # Với n-gram ký tự thì 「に行きたいです」 gần như trùng khít, nên thứ DUY
    # NHẤT phân biệt được hai bên là DANH TỪ. Vì vậy mọi ví dụ dưới đây đều
    # dùng địa điểm gần (駅・コンビニ・銀行…) vốn đã xuất hiện dày trong các ý
    # định hỏi đường khác. Thêm một địa danh xa (国名・観光地) vào đây sẽ kéo
    # 「日本に行きたいです」 sang phía hợp lệ và làm hỏng lớp từ chối.
    - 駅に行きたいです
    - えきに行きたいです
    - 駅へ行きたいんですが
    - コンビニに行きたいです
    - トイレに行きたいです
    - 銀行に行きたいです
    - 病院に行きたいんですが
    - ホテルに行きたいです
    - 空港へ行きたいです
    - バス停に行きたいです
    - 郵便局に行きたいです
    - 東京駅に行きたいんですが

- intent: directions_ask_time
  scenario: directions
  description: "Hỏi mất bao lâu / khoảng cách"
  examples:
    - どのくらいかかりますか
    - どのぐらいかかりますか
    - 何分かかりますか
    - なんぷんかかりますか
    - 何分ぐらいですか
    - 時間はどのくらいかかりますか
    - 遠いですか
    - とおいですか
    - 近いですか
    - ちかいですか
    - 歩いて何分ですか
    - あるいて何分ぐらいですか
    - 電車で何分ですか
    - ここから遠いですか
    - どのくらい歩きますか
    - 五分ぐらいですか
    - すぐですか
    - 何キロぐらいですか

- intent: directions_ask_nearby
  scenario: directions
  description: "Hỏi gần đây có gì không / xác nhận mốc"
  examples:
    - この近くにコンビニはありますか
    - 近くにコンビニはありますか
    - ちかくにコンビニはありますか
    - この近くに駅はありますか
    - この近くにレストランはありますか
    - 近くに薬局はありますか
    - この辺にATMはありますか
    - この近くにトイレはありますか
    - あそこの建物は何ですか
    - あの建物は何ですか
    - あれは駅ですか
    - ここはどこですか
    - ここは何という場所ですか
    - この道の名前は何ですか
    - 目印はありますか
    - この地図のどこにいますか
    - 今どこにいますか
    - 信号のところですか
