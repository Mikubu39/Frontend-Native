# ---------------------------------------------------------------------------
# NHÃN TỪ CHỐI (rejection class) + ý định meta.
#
# `out_of_scope` là nhãn QUAN TRỌNG NHẤT của toàn bộ dataset. Không có nó, bộ
# phân loại buộc phải gán MỌI câu vào một trong các ý định hợp lệ (softmax luôn
# tổng bằng 1), nên câu vô nghĩa vẫn bị đẩy thành "gọi món" với độ tin cậy cao.
#
# Bốn nhóm nhiễu được soạn có chủ ý:
#   A. Tiếng Nhật ĐÚNG nhưng lạc đề  (thời tiết, anime, chuyện riêng)
#   B. Ký tự ngẫu nhiên / đập bàn phím
#   C. Thử thách chatbot, câu trêu đùa
#   D. Câu cụt, ký hiệu, số, emoji
#
# Nhóm A là nhóm KHÓ nhất: nó hợp lệ về ngữ pháp và dùng chung nhiều n-gram với
# lớp hợp lệ (です / ますか / は), nên nó quyết định phần lớn lỗi của mô hình.
# Xem reports/EVALUATION.md mục "Phân tích lỗi".
# ---------------------------------------------------------------------------

- intent: out_of_scope
  scenario: global
  description: "Ngoài phạm vi kịch bản - cần từ chối và điều hướng lại"
  examples:
    # --- Nhóm A: tiếng Nhật hợp lệ nhưng lạc đề ---
    - 今日はいい天気ですね
    - きょうはいい天気ですね
    - 明日は雨ですか
    - 天気はどうですか
    - 寒いですね
    - さむいですね
    - 暑いですね
    - 今何時ですか
    - いま何時ですか
    - 今日は何曜日ですか
    - 明日は休みです
    - アニメが好きですか
    - ナルトを見ましたか
    - ワンピースが好きです
    - 日本の音楽を聞きますか
    - 好きな歌手は誰ですか
    - サッカーの試合を見ましたか
    - 昨日映画を見ました
    - 猫が好きです
    - 犬を飼っています
    - 私は疲れました
    - 眠いです
    - ねむいです
    - お腹が痛いです
    - 頭が痛いです
    - 宿題が多いです
    - 試験が難しかったです
    # Cặp ĐỐI CHỨNG với 「〜に行きたいです」 ở directions_ask_how_to_get.
    # Cùng y hệt mẫu đuôi câu; thứ duy nhất phân biệt là DANH TỪ - đích xa /
    # đi chơi (quốc gia, khu du lịch, biển) chứ không phải địa điểm đi bộ tới
    # được. Không có nhóm này thì mẫu 「に行きたいです」 lấn hết và mọi câu mơ
    # ước du lịch đều bị hiểu thành hỏi đường.
    - 日本に行きたいです
    - ハワイに行きたいです
    - アメリカに行きたいです
    - 沖縄に行きたいです
    - ディズニーランドに行きたいです
    - 温泉に行きたいです
    - 海に行きたいです
    - 旅行に行きたいです
