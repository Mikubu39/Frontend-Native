    - コロナは大丈夫ですか
    - 給料はいくらですか
    - 何歳ですか教えて
    - 電話番号を教えてください
    - LINEを教えてください
    - インスタをフォローして
    - 一緒に写真を撮りませんか
    - 恋人になってください
    - 愛しています
    - 好きです、付き合ってください

