# ---------------------------------------------------------------------------
# Tình huống: MUA SẮM (買い物) - trình độ N5
# Vai của AI: 店員 (nhân viên cửa hàng quần áo). Vai người học: khách mua đồ.
#
# LƯU Ý khi soạn: ý định `shopping_ask_price` cố tình rất giống
# `restaurant_ask_price` (cùng mẫu câu "いくらですか"). Đây là cặp nhập nhằng
# ĐƯỢC GIỮ LẠI CÓ CHỦ Ý để đo khả năng phân biệt của mô hình - và cũng là lý do
# tầng định tuyến theo kịch bản (scenario routing) tồn tại: hai ý định này dẫn
# tới cùng một hành động nên nhầm lẫn giữa chúng KHÔNG gây hại cho người dùng.
# Xem reports/DATASET.md mục "Nhập nhằng có chủ ý".
# ---------------------------------------------------------------------------

- intent: shopping_ask_item
  scenario: shopping
  description: "Hỏi cửa hàng có bán món đồ nào đó không / tìm đồ"
  examples:
    - Tシャツはありますか
    - ティーシャツはありますか
    - シャツはありますか
    - ズボンはありますか
    - くつはありますか
    - 靴はありますか
    - かばんはありますか
    - 帽子はありますか
    - ぼうしはありますか
    - コートはありますか
    - この商品はありますか
    - これはありますか
    - 傘を探しています
    - かさを探しています
    - シャツを探しています
    - お土産を探しています
    - おみやげを探しています
    - プレゼントを探しています
    - 何かおすすめはありますか
    - 新しいのはありますか
    - 売っていますか
    - どこにありますか
    - Tシャツを見せてください
    - あれを見せてください

