    - もっと小さいのはありますか
    - 他の色はありますか
    - ほかの色はありますか
    - 別の色はありますか
    - 白はありますか
    - しろはありますか
    - 黒はありますか
    - くろはありますか
    - 青いのはありますか
    - 赤いのはありますか
    - この色の違うサイズはありますか
    - サイズは何がありますか
    - これのMサイズをお願いします
