# ---------------------------------------------------------------------------
# Tình huống: TỰ GIỚI THIỆU / LÀM QUEN (自己紹介) - trình độ N5
# Vai của AI: クラスメート (bạn cùng lớp mới gặp). Vai người học: học viên mới.
#
# Đây là kịch bản mà người học ĐIỀN THÔNG TIN CỦA CHÍNH MÌNH, nên ví dụ cố ý
# chứa nhiều tên riêng / quốc gia / nghề nghiệp khác nhau. Mục tiêu là mô hình
# học được KHUNG CÂU (私は__です / __から来ました) chứ không học thuộc từ vựng
# điền vào chỗ trống - char n-gram xử lý tốt việc này vì khung câu là các
# n-gram tần suất cao còn danh từ riêng thì thưa.
# ---------------------------------------------------------------------------

- intent: intro_nice_to_meet
  scenario: self_intro
  description: "Hân hạnh làm quen / mở đầu màn giới thiệu"
  examples:
    - はじめまして
    - 初めまして
    - はじめまして、よろしくお願いします
    - よろしくお願いします
    - よろしくおねがいします
    - よろしくお願いいたします
    - どうぞよろしくお願いします
    - よろしく
    - こちらこそよろしくお願いします
    - はじめまして、どうぞよろしく
    - お会いできてうれしいです
    - お会いできて嬉しいです
    - 会えてうれしいです
    - これからよろしくお願いします
    - よろしくおねがいしまs      # lỗi gõ dở dang (romaji sót lại)
    - はじめましてー
    - はじめまして！

