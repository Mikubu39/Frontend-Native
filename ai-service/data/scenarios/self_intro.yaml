id: self_intro
title: "Làm quen bạn mới"
title_ja: "自己紹介"
level: N5
icon: hand-left-outline
color: "#10B981"
description: "Ngày đầu ở lớp tiếng Nhật. Chào, giới thiệu tên, quê quán, nghề nghiệp và sở thích."
goal: "Giới thiệu được tên, nơi đến và một sở thích."
persona:
  name: "Bạn cùng lớp"
  name_ja: "クラスメート"
  emoji: "🙋"

initial_state: first_meet

# Kịch bản KHÔNG CÓ THỨ TỰ nhất trong bốn cái. Người thật giới thiệu tên,
# quê, nghề, sở thích theo bất kỳ trình tự nào - ép một trình tự cứng là
# chỗ FSM sai nặng nhất. Toàn bộ ý định nội dung đều vào đây; `expects` của
# từng bước vẫn dẫn mạch truyện tiến lên khi câu đó đúng là câu đang chờ.
anytime:
  - intent: intro_name
    reply:
      ja: "そうなんですね、よろしくお願いします！"
      vi: "Vậy à, rất vui được quen bạn!"
  - intent: intro_origin
    reply:
      ja: "へえ、そうなんですか。行ってみたいです。"
      vi: "Ồ, vậy à. Mình muốn tới đó thử lắm."
  - intent: intro_job
    reply:
      ja: "いいですね、大変じゃないですか。"
      vi: "Hay quá, có vất vả không?"
  - intent: intro_hobby
    reply:
      ja: "私も好きです！今度一緒にやりましょう。"
      vi: "Mình cũng thích! Lần tới cùng làm nhé."
  - intent: intro_nice_to_meet
    reply:
      ja: "こちらこそ、よろしくお願いします。"
      vi: "Mình cũng vậy, mong được giúp đỡ."
  - intent: intro_ask_back
    reply:
      ja: "私は東京から来た学生です。趣味は写真ですよ。"
      vi: "Mình là sinh viên đến từ Tokyo. Sở thích là chụp ảnh đấy."

states:
  - id: first_meet
    bot:
      - ja: "はじめまして！田中ゆきです。よろしくお願いします。"
        vi: "Rất vui được gặp bạn! Mình là Tanaka Yuki. Mong được giúp đỡ."
    hints:
      - ja: "はじめまして、私はアンです。"
        vi: "Chào bạn, mình là An."
    expects:
      - intent: intro_nice_to_meet
        reply:
          ja: "こちらこそ、よろしくお願いします。お名前は何ですか。"
          vi: "Mình cũng vậy, mong được giúp đỡ. Bạn tên gì thế?"
        next: asked_name
      - intent: intro_name
        reply:
          ja: "よろしくお願いします！どこから来ましたか。"
          vi: "Rất vui được quen bạn! Bạn đến từ đâu vậy?"
        next: asked_origin
      - intent: greeting
        reply:
          ja: "こんにちは！はじめてですよね。お名前は何ですか。"
          vi: "Chào bạn! Lần đầu gặp nhỉ. Bạn tên gì thế?"
        next: asked_name

  - id: asked_name
    bot: []
    hints:
      - ja: "私はアンです。"
        vi: "Mình là An."
      - ja: "アンと申します。"
        vi: "Mình tên là An ạ."
    expects:
      - intent: intro_name
        reply:
          ja: "アンさんですね。よろしくお願いします。どこから来ましたか。"
          vi: "An à. Rất vui được quen bạn. Bạn đến từ đâu thế?"
        next: asked_origin
      - intent: intro_nice_to_meet
        reply:
          ja: "こちらこそ！それで、お名前は何ですか。"
          vi: "Mình cũng vậy! Thế bạn tên gì nhỉ?"
        next: asked_name

  - id: asked_origin
    bot: []
    hints:
      - ja: "ベトナムから来ました。"
        vi: "Mình đến từ Việt Nam."
    expects:
      - intent: intro_origin
        reply:
          ja: "そうなんですか！ベトナムは行ってみたいです。お仕事は何ですか。"
          vi: "Vậy à! Mình muốn đi Việt Nam lắm. Bạn làm nghề gì thế?"
        next: asked_job
      - intent: intro_ask_back
        reply:
          ja: "私は東京から来ました。アンさんはどこから来ましたか。"
          vi: "Mình đến từ Tokyo. Còn An đến từ đâu?"
        next: asked_origin
      - intent: intro_name
        reply:
          ja: "はい、覚えました。それで、どこから来ましたか。"
          vi: "Ừ, mình nhớ rồi. Thế bạn đến từ đâu?"
        next: asked_origin

  - id: asked_job
    bot: []
    hints:
      - ja: "学生です。"
        vi: "Mình là sinh viên."
      - ja: "会社員です。"
        vi: "Mình là nhân viên công ty."
    expects:
      - intent: intro_job
        reply:
          ja: "いいですね。趣味は何ですか。"
          vi: "Hay quá. Sở thích của bạn là gì?"
        next: asked_hobby
      - intent: intro_ask_back
        reply:
          ja: "私は学生です。アンさんはお仕事は何ですか。"
          vi: "Mình là sinh viên. Còn An làm nghề gì?"
        next: asked_job

  - id: asked_hobby
    bot: []
    hints:
      - ja: "趣味は音楽です。"
        vi: "Sở thích của mình là âm nhạc."
      - ja: "アニメが好きです。"
        vi: "Mình thích anime."
    expects:
      - intent: intro_hobby
        reply:
          ja: "私も好きです！今度一緒に行きましょう。"
          vi: "Mình cũng thích! Lần tới đi cùng nhau nhé."
        next: wrap_up
      - intent: intro_ask_back
        reply:
          ja: "私の趣味は写真です。アンさんの趣味は何ですか。"
          vi: "Sở thích của mình là chụp ảnh. Còn sở thích của An là gì?"
        next: asked_hobby

  - id: wrap_up
    bot: []
    hints:
      - ja: "よろしくお願いします。"
        vi: "Mong được giúp đỡ."
      - ja: "また明日。"
        vi: "Hẹn mai gặp lại."
    expects:
      - intent: intro_nice_to_meet
        reply:
          ja: "こちらこそ、よろしくお願いします！また明日、教室で。"
          vi: "Mình cũng vậy, mong được giúp đỡ! Mai gặp lại ở lớp nhé."
        next: done
      - intent: farewell
        reply:
          ja: "また明日ね！さようなら。"
          vi: "Mai gặp lại nhé! Tạm biệt."
        next: done
      - intent: thanks
        reply:
          ja: "いえいえ。また明日ね！"
          vi: "Không có gì. Mai gặp lại nhé!"
        next: done
      - intent: intro_ask_back
        reply:
          ja: "私は写真が好きです。じゃあ、また明日！"
          vi: "Mình thích chụp ảnh. Thôi, mai gặp lại nhé!"
        next: done

  - id: done
    terminal: true
    bot: []
