# ---------------------------------------------------------------------------
# Kịch bản hội thoại NHÀ HÀNG - máy trạng thái hữu hạn (FSM).
#
# Mỗi `state` là một lượt của AI. `expects` liệt kê các ý định hợp lệ TẠI state
# đó; mỗi ý định có câu đáp và state kế tiếp. Ý định hợp lệ nhưng KHÔNG nằm
# trong `expects` -> phản hồi "đúng tiếng Nhật nhưng chưa hợp lúc này" (nhẹ
# nhàng hơn nhiều so với báo lỗi), xem `dialogue.py`.
# ---------------------------------------------------------------------------

id: restaurant
title: "Ở nhà hàng"
title_ja: "レストランで"
level: N5
icon: restaurant-outline
color: "#E8613C"
description: "Vào quán, báo số người, hỏi món, gọi món và thanh toán."
goal: "Gọi được một món và xin tính tiền."
persona:
  name: "Nhân viên phục vụ"
  name_ja: "店員"
  emoji: "🍜"

initial_state: welcome

# Hỏi thực đơn / giá / nguyên liệu là chuyện khách hỏi lúc nào cũng được.
# CỐ Ý không đưa `restaurant_ask_bill`, `restaurant_order`, `restaurant_seat`
# vào đây: chúng là các mốc của mạch truyện, và "đòi tính tiền khi chưa ngồi
# vào bàn" đúng là thứ nên bị chặn để dạy trình tự.
anytime:
  - intent: restaurant_ask_menu
    reply:
      ja: "本日のおすすめはラーメンと天ぷら定食でございます。"
      vi: "Món gợi ý hôm nay là mì ramen và set tempura ạ."
  - intent: restaurant_ask_price
    reply:
      ja: "ラーメンは八百円、天ぷら定食は千二百円でございます。"
      vi: "Ramen 800 yên, set tempura 1200 yên ạ."
  - intent: restaurant_ask_ingredient
    reply:
      ja: "ラーメンには豚肉が入っております。野菜だけのものもご用意できますよ。"
      vi: "Ramen có thịt lợn ạ. Bên em cũng có loại chỉ rau thôi ạ."

states:
  - id: welcome
    bot:
      - ja: "いらっしゃいませ！何名様ですか。"
        vi: "Xin mời vào! Quý khách đi mấy người ạ?"
    hints:
      - ja: "二人です。"
        vi: "Hai người ạ."
      - ja: "一人です。"
        vi: "Một người ạ."
    expects:
      - intent: restaurant_seat
        reply:
          ja: "かしこまりました。こちらの席へどうぞ。メニューでございます。"
          vi: "Vâng ạ. Mời quý khách ngồi bàn này. Đây là thực đơn ạ."
        next: seated
      - intent: greeting
        reply:
          ja: "こんにちは！何名様ですか。"
          vi: "Xin chào! Quý khách đi mấy người ạ?"
        next: welcome

  - id: seated
    bot: []
    hints:
      - ja: "おすすめは何ですか。"
        vi: "Món nào ngon ạ?"
      - ja: "メニューを見せてください。"
        vi: "Cho tôi xem thực đơn."
    expects:
      - intent: restaurant_ask_menu
        reply:
          ja: "本日のおすすめはラーメンと天ぷら定食です。ラーメンが一番人気ですよ。"
          vi: "Món gợi ý hôm nay là mì ramen và set tempura ạ. Ramen được ưa chuộng nhất."
        next: seated
      - intent: restaurant_ask_price
        reply:
          ja: "ラーメンは八百円、天ぷら定食は千二百円でございます。"
          vi: "Ramen 800 yên, set tempura 1200 yên ạ."
        next: seated
      - intent: restaurant_ask_ingredient
        reply:
          ja: "ラーメンには豚肉が入っております。野菜だけのものもご用意できますよ。"
          vi: "Ramen có thịt lợn ạ. Bên em cũng có loại chỉ rau thôi ạ."
        next: seated
      - intent: restaurant_order
        reply:
          ja: "かしこまりました。少々お待ちください。"
          vi: "Vâng ạ. Quý khách chờ một chút ạ."
        next: order_taken
      - intent: restaurant_seat
        reply:
          ja: "はい、こちらの席で大丈夫ですよ。ごゆっくりどうぞ。"
          vi: "Vâng, bàn này được ạ. Mời quý khách tự nhiên."
        next: seated

  - id: order_taken
    bot:
      - ja: "お待たせしました。ご注文の品でございます。ほかに何かご注文はありますか。"
        vi: "Xin lỗi đã để quý khách chờ. Món của quý khách đây ạ. Quý khách có gọi thêm gì không ạ?"
    hints:
      - ja: "いいえ、大丈夫です。"
        vi: "Không, vậy đủ rồi ạ."
      - ja: "お水をください。"
        vi: "Cho tôi xin nước."
    expects:
      - intent: deny
        reply:
          ja: "かしこまりました。ごゆっくりどうぞ。"
          vi: "Vâng ạ. Mời quý khách dùng bữa."
        next: eating
      - intent: affirm
        reply:
          ja: "はい、何になさいますか。"
          vi: "Vâng, quý khách dùng gì ạ?"
        next: seated
      - intent: restaurant_order
        reply:
          ja: "かしこまりました。すぐにお持ちします。"
          vi: "Vâng ạ, em mang ra ngay ạ."
        next: eating
      - intent: thanks
        reply:
          ja: "とんでもございません。ごゆっくりどうぞ。"
          vi: "Dạ không có gì ạ. Mời quý khách dùng bữa."
        next: eating

  - id: eating
    bot: []
    hints:
      - ja: "お会計お願いします。"
        vi: "Cho tôi thanh toán."
    expects:
      - intent: restaurant_ask_bill
        reply:
          ja: "お会計は千五百円でございます。お支払いは現金でもカードでも大丈夫です。"
          vi: "Tổng cộng 1500 yên ạ. Quý khách trả tiền mặt hay thẻ đều được ạ."
        next: paying
      - intent: restaurant_order
        reply:
          ja: "かしこまりました。すぐにお持ちします。"
          vi: "Vâng ạ, em mang ra ngay ạ."
        next: eating
      - intent: restaurant_ask_price
        reply:
          ja: "ただいまの合計は千五百円でございます。"
          vi: "Tổng hiện tại là 1500 yên ạ."
        next: eating

  - id: paying
    bot: []
    hints:
      - ja: "カードで払えますか。"
        vi: "Tôi trả thẻ được không?"
      - ja: "ありがとうございました。"
        vi: "Cảm ơn ạ."
    expects:
      - intent: restaurant_ask_bill
        reply:
          ja: "はい、カードもお使いいただけます。ありがとうございました！"
          vi: "Vâng, quý khách dùng thẻ được ạ. Cảm ơn quý khách!"
        next: done
      - intent: thanks
        reply:
          ja: "ありがとうございました。またお越しくださいませ！"
          vi: "Cảm ơn quý khách. Mong được đón tiếp lần sau ạ!"
        next: done
      - intent: affirm
        reply:
          ja: "ありがとうございました。またお越しくださいませ！"
          vi: "Cảm ơn quý khách. Mong được đón tiếp lần sau ạ!"
        next: done
      - intent: farewell
        reply:
          ja: "ありがとうございました。またお越しくださいませ！"
          vi: "Cảm ơn quý khách. Mong được đón tiếp lần sau ạ!"
        next: done

  - id: done
    terminal: true
    bot: []
