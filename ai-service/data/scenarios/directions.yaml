id: directions
title: "Hỏi đường"
title_ja: "道を聞く"
level: N5
icon: navigate-outline
color: "#3B82F6"
description: "Bạn bị lạc gần ga. Hỏi đường, hỏi cách đi và mất bao lâu."
goal: "Hỏi được đường tới ga và biết mất bao lâu."
persona:
  name: "Người qua đường"
  name_ja: "通行人"
  emoji: "🧭"

initial_state: approach

# Hỏi đường vốn không có thứ tự: "ở đâu" / "đi thế nào" / "mất bao lâu" /
# "gần đây có gì" đều tự nhiên ở bất kỳ lúc nào. Trạng thái nào có câu đáp
# riêng hay hơn thì `expects` của nó vẫn thắng.
anytime:
  - intent: directions_ask_where
    reply:
      ja: "あの信号を右に曲がって、まっすぐ行くとありますよ。"
      vi: "Bạn rẽ phải ở chỗ đèn giao thông kia rồi đi thẳng là tới."
  - intent: directions_ask_how_to_get
    reply:
      ja: "歩いて行けますよ。この道をまっすぐ行って、二つ目の角を右です。"
      vi: "Đi bộ được đấy. Bạn đi thẳng đường này, tới góc thứ hai thì rẽ phải."
  - intent: directions_ask_time
    reply:
      ja: "歩いて十分ぐらいです。そんなに遠くないですよ。"
      vi: "Đi bộ khoảng 10 phút. Không xa lắm đâu."
  - intent: directions_ask_nearby
    reply:
      ja: "はい、この近くにありますよ。あの角を曲がってください。"
      vi: "Có, ngay gần đây thôi. Bạn rẽ ở góc kia nhé."

states:
  - id: approach
    bot:
      - ja: "はい、どうしましたか。"
        vi: "Vâng, bạn cần gì thế?"
    hints:
      - ja: "すみません、駅はどこですか。"
        vi: "Xin lỗi, ga tàu ở đâu ạ?"
    expects:
      - intent: apologize
        reply:
          ja: "いえいえ、大丈夫ですよ。何かお探しですか。"
          vi: "Không sao đâu. Bạn đang tìm gì vậy?"
        next: approach
      - intent: greeting
        reply:
          ja: "こんにちは。何かお困りですか。"
          vi: "Chào bạn. Bạn đang gặp khó khăn gì à?"
        next: approach
      - intent: directions_ask_where
        reply:
          ja: "駅ですね。あの信号を右に曲がって、まっすぐ行くとありますよ。"
          vi: "Ga tàu à. Bạn rẽ phải ở chỗ đèn giao thông kia rồi đi thẳng là tới."
        next: got_direction
      - intent: directions_ask_nearby
        reply:
          ja: "はい、この近くにありますよ。あの角を曲がってください。"
          vi: "Có, ngay gần đây thôi. Bạn rẽ ở góc kia nhé."
        next: got_direction

  - id: got_direction
    bot: []
    hints:
      - ja: "どのくらいかかりますか。"
        vi: "Mất khoảng bao lâu ạ?"
      - ja: "歩いて行けますか。"
        vi: "Đi bộ được không ạ?"
    expects:
      - intent: directions_ask_time
        reply:
          ja: "歩いて十分ぐらいです。そんなに遠くないですよ。"
          vi: "Đi bộ khoảng 10 phút. Không xa lắm đâu."
        next: confirmed
      - intent: directions_ask_how_to_get
        reply:
          ja: "歩いて行けますよ。この道をまっすぐ行って、二つ目の角を右です。"
          vi: "Đi bộ được đấy. Bạn đi thẳng đường này, tới góc thứ hai thì rẽ phải."
        next: confirmed
      - intent: directions_ask_where
        reply:
          ja: "あの信号の向こう側です。青い建物の隣ですよ。"
          vi: "Ở bên kia đèn giao thông kia. Cạnh toà nhà màu xanh ấy."
        next: got_direction
      - intent: not_understand
        reply:
          ja: "ゆっくり言いますね。あの信号を、右です。それから、まっすぐです。"
          vi: "Mình nói chậm nhé. Đèn giao thông kia, rẽ phải. Rồi đi thẳng."
        next: got_direction

  - id: confirmed
    bot: []
    hints:
      - ja: "ありがとうございました。"
        vi: "Cảm ơn anh/chị ạ."
    expects:
      - intent: thanks
        reply:
          ja: "どういたしまして。気をつけて行ってくださいね。"
          vi: "Không có gì. Bạn đi cẩn thận nhé."
        next: done
      - intent: directions_ask_time
        reply:
          ja: "歩いて十分ぐらいですよ。"
          vi: "Đi bộ khoảng 10 phút thôi."
        next: confirmed
      - intent: directions_ask_nearby
        reply:
          ja: "はい、途中にコンビニもありますよ。"
          vi: "Có, trên đường đi cũng có cửa hàng tiện lợi đấy."
        next: confirmed
      - intent: farewell
        reply:
          ja: "はい、気をつけて。さようなら。"
          vi: "Vâng, đi cẩn thận nhé. Tạm biệt."
        next: done

  - id: done
    terminal: true
    bot: []
